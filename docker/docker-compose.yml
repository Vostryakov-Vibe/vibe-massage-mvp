# ===========================================================================
#  Изолированный запуск: docker compose -f docker/docker-compose.yml up --build
#  Данные (БД и загруженные изображения) хранятся в именованных томах,
#  поэтому пересборка контейнера их не удаляет.
# ===========================================================================
services:
  salon:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: salon-harmony:1.0.0
    container_name: salon-harmony
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      DEBUG: "false"
      # Секреты (SECRET_KEY, пароли, токены Telegram/VK/Turnstile) живут
      # только в ../.env. Значения из environment переопределяют env_file,
      # поэтому построчное дублирование вида ${VAR:-} затирало реальные
      # значения из .env (SECRET_KEY подписывался бы захардкоженным ключом).
    env_file:
      # Файл .env необязателен: без него приложение работает в офлайн-режиме.
      - path: ../.env
        required: false
    volumes:
      - salon-db:/app/instance
      - salon-uploads:/app/static/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  salon-db:
  salon-uploads:
